name: Validate Android download website
on:
  push:
    branches: [main]
    paths: ["site/**", "downloads/**", ".github/workflows/download-site.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check APK and prepare static website
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          root = pathlib.Path('.')
          metadata = json.loads((root/'downloads/release.json').read_text())
          apk = (root/'downloads/personal-os.apk').read_bytes()
          assert len(apk) == metadata['sizeBytes']
          assert hashlib.sha256(apk).hexdigest() == metadata['sha256']
          assert re.search(r'href="personal-os[.]apk(?:[?][^"]*)?"', (root/'site/index.html').read_text())
          (root/'site/personal-os.apk').write_bytes(apk)
          (root/'site/release.json').write_text(json.dumps(metadata, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: personal-os-download-website
          path: site
